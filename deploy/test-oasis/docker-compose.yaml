services:
  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:16.1.1
    container_name: nomad_oasis_keycloak
    environment:
      - PROXY_ADDRESS_FORWARDING=true
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=password
      - KEYCLOAK_FRONTEND_URL=http://localhost/keycloak/auth
      - KEYCLOAK_IMPORT="/tmp/nomad-realm.json"
    command:
      - "-Dkeycloak.import=/tmp/nomad-realm.json -Dkeycloak.migration.strategy=IGNORE_EXISTING"
    volumes:
      - keycloak:/opt/jboss/keycloak/standalone/data
      - ./configs/nomad-realm.json:/tmp/nomad-realm.json
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9990/health/live" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4
    container_name: nomad_oasis_rabbitmq
    environment:
      - RABBITMQ_ERLANG_COOKIE=SWQOKODSQALRPCLNMEQG
      - RABBITMQ_DEFAULT_USER=rabbitmq
      - RABBITMQ_DEFAULT_PASS=rabbitmq
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "--silent", "--quiet", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  elastic:
    restart: unless-stopped
    image: elasticsearch:7.17.24
    container_name: nomad_oasis_elastic
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
    volumes:
      - elastic:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://elastic:9200/_cat/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  mongo:
    restart: unless-stopped
    image: mongo:5
    container_name: nomad_oasis_mongo
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongo:/data/db
      - ./.volumes/mongo:/backup
    command: mongod --logpath=/dev/null
    healthcheck:
      test: ["CMD", "mongo", "mongo:27017/test", "--quiet", "--eval", "'db.runCommand({ping:1}).ok'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  temporal:
    restart: unless-stopped
    image: ghcr.io/fairmat-nfdi/temporal-dev-server:v1.4.0
    container_name: nomad_oasis_temporal
    volumes:
      - temporal:/data

  worker:
    restart: unless-stopped
    image: ${NOMAD_IMAGE:-nomad-oasis-local:stable}
    container_name: nomad_oasis_worker
    environment:
      NOMAD_SERVICE: nomad_oasis_worker
      NOMAD_RABBITMQ_HOST: rabbitmq
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_TEMPORAL_HOST: temporal
      NOMAD_SERVICES_API_SECRET: ${NOMAD_SERVICES_API_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml:ro
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run action-internal-worker --workers 1

  app:
    restart: unless-stopped
    image: ${NOMAD_IMAGE:-nomad-oasis-local:stable}
    container_name: nomad_oasis_app
    environment:
      NOMAD_SERVICE: nomad_oasis_app
      NOMAD_SERVICES_API_PORT: 80
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_RABBITMQ_HOST: rabbitmq
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_TEMPORAL_HOST: temporal
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_SERVICES_API_SECRET: ${NOMAD_SERVICES_API_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      elastic:
        condition: service_healthy
      mongo:
        condition: service_healthy
      temporal:
        condition: service_started
      north:
        condition: service_started
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml:ro
      - ./.volumes/fs:/app/.volumes/fs
    command: python -m nomad.cli admin run app --with-gui --gunicorn --host 0.0.0.0 --workers 1
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8000/-/health"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 300s

  north:
    restart: unless-stopped
    image: ${NOMAD_IMAGE:-nomad-oasis-local:stable}
    container_name: nomad_oasis_north
    environment:
      NOMAD_SERVICE: nomad_oasis_north
      NOMAD_NORTH_DOCKER_NETWORK: nomad_oasis_network
      NOMAD_NORTH_HUB_CONNECT_IP: north
      NOMAD_NORTH_HUB_IP: "0.0.0.0"
      NOMAD_NORTH_HUB_HOST: north
      NOMAD_SERVICES_API_HOST: app
      NOMAD_FS_EXTERNAL_WORKING_DIRECTORY: "$PWD"
      NOMAD_RABBITMQ_HOST: rabbitmq
      NOMAD_ELASTIC_HOST: elastic
      NOMAD_MONGO_HOST: mongo
      NOMAD_TEMPORAL_HOST: temporal
      NOMAD_SERVICES_API_SECRET: ${NOMAD_SERVICES_API_SECRET}
    volumes:
      - ./configs/nomad.yaml:/app/nomad.yaml:ro
      - ./.volumes/fs:/app/.volumes/fs
      - /var/run/docker.sock:/var/run/docker.sock
    user: "1000:${DOCKER_GID:-991}"
    command: python -m nomad.cli admin run hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "10", "http://localhost:8081/nomad-oasis/north/hub/health"]
      interval: 10s
      timeout: 15s
      retries: 90
      start_period: 300s

  proxy:
    restart: unless-stopped
    image: nginx:stable-alpine
    container_name: nomad_oasis_proxy
    command: nginx -g 'daemon off;'
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      worker:
        condition: service_started
      north:
        condition: service_started
    ports:
      - "${OASIS_HTTP_PORT:-80}:80"

volumes:
  mongo:
    name: nomad_oasis_mongo
  elastic:
    name: nomad_oasis_elastic
  rabbitmq:
    name: nomad_oasis_rabbitmq
  temporal:
    name: nomad_oasis_temporal

networks:
  default:
    name: nomad_oasis_network
