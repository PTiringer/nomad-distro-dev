map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Pool of keep-alive connections to the app backend
upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect all to HTTPS
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/mounted-nomad-oasis.crt;
    ssl_certificate_key /etc/nginx/tls/mounted-nomad-oasis.key;

    proxy_set_header Host $host;
    #proxy_set_header X-Real-IP $remote_addr;
    #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #proxy_set_header X-Forwarded-Host $http_host;
    #proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    #proxy_connect_timeout 60s;
    #proxy_send_timeout 300s;
    #proxy_read_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    gzip_min_length 1000;
    gzip_buffers 4 8k;
    gzip_http_version 1.0;
    gzip_disable "msie6";
    gzip_vary on;
    gzip on;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;

    location /keycloak {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        
        proxy_pass http://keycloak:8080;
    }

    location = / {
        return 302 /nomad-oasis/gui/;
    }

    location / {
        proxy_pass http://app:8000;
    }

    location ~ /nomad-oasis\/?(gui)?$ {
        rewrite ^ /nomad-oasis/gui/ permanent;
    }

    location = /nomad-oasis/gui/pace.min.js {
        proxy_pass http://app:8000/nomad-oasis/gui/vendor/pace.min.js;
    }

    location = /nomad-oasis/gui/tex-mml-chtml.js {
        proxy_pass http://app:8000/nomad-oasis/gui/vendor/tex-mml-chtml.js;
    }

    location /nomad-oasis/gui/ {
        proxy_intercept_errors on;
        error_page 404 = @redirect_to_index;
        proxy_pass http://app:8000;
    }

    location @redirect_to_index {
        rewrite ^ /nomad-oasis/gui/index.html break;
        proxy_pass http://app:8000;
    }

    location ~ \/gui\/(service-worker\.js|meta\.json)$ {
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        if_modified_since off;
        expires off;
        etag off;
        proxy_pass http://app:8000;
    }

    location ~ /api/v1/uploads(/?$|.*/raw|.*/bundle?$) {
        client_max_body_size 35g;
        proxy_request_buffering off;
        proxy_pass http://app:8000;
    }

    location ~ /api/v1/.*/download {
        proxy_buffering off;
        proxy_pass http://app:8000;
    }

    location /nomad-oasis/north/ {
        client_max_body_size 500m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://north:9000;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Scheme $scheme;

        proxy_buffering off;
    }
    #include conf.d/nginx_base_conf;
}
